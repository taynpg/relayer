name: CI

# 触发策略：只在打 tag 时跑。
#
# 理由：日常提交频繁，跑完整 CI（尤其 Windows 上的 Qt 下载与完整构建）
# 会消耗大量额度与时间，收益却低于本地跑一遍 ctest。tag 是对外的承诺，
# 在承诺之前做全量验证才有意义。
#
# 需要临时验证某个分支时用 workflow_dispatch 手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 tag 不会被并发触发两次；手动触发时允许替换前一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux：核心库 + 测试 + 架构检查。最快的一条线，先跑，挂得早。
  # ---------------------------------------------------------------------------
  linux-core:
    name: Linux / core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRELAYER_BUILD_GUI=OFF \
            -DRELAYER_BUILD_SERVER=ON \
            -DRELAYER_BUILD_CLI=ON \
            -DRELAYER_BUILD_TESTS=ON \
            -DRELAYER_WERROR=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        working-directory: build
        run: ctest --output-on-failure

      - name: 格式检查
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h' '*.hpp')
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 C++ 源文件，跳过"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

  # ---------------------------------------------------------------------------
  # Windows：完整构建（含 GUI）。Qt 用 aqt 装，版本固定在环境变量里，
  # 避免上游镜像变动导致 CI 随机失败。
  # ---------------------------------------------------------------------------
  windows-full:
    name: Windows / full
    runs-on: windows-2022
    env:
      QT_VERSION: 6.7.3
      QT_ARCH: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: 安装 Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --outputdir C:\Qt

      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=C:\Qt\${{ env.QT_VERSION }}\msvc2022_64 `
            -DRELAYER_BUILD_TESTS=ON `
            -DRELAYER_WERROR=ON

      - name: 构建
        shell: pwsh
        run: cmake --build build --parallel

      - name: 测试
        working-directory: build
        run: ctest --output-on-failure

  # ---------------------------------------------------------------------------
  # MinGW（MSYS2 UCRT64）：主力开发环境，必须保证能编。
  # ---------------------------------------------------------------------------
  windows-mingw:
    name: Windows / mingw
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang-tools

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRELAYER_BUILD_GUI=OFF \
            -DRELAYER_BUILD_TESTS=ON \
            -DRELAYER_WERROR=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        working-directory: build
        run: ctest --output-on-failure
